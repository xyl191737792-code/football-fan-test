<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <title>足彩人格小测试</title>
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link href="https://miaoda.feishu.cn/fonts/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#101820;--paper:#f5f1e8;--lime:#c6f36b;--coral:#ff6b52;--muted:#7b827e;--line:rgba(16,24,32,.14)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC','DM Sans',sans-serif}button{font:inherit;cursor:pointer;border:0} .shell{min-height:100vh;display:flex;justify-content:center;padding:20px}.app{width:min(100%,520px);min-height:calc(100vh - 40px);position:relative;overflow:hidden;background:var(--paper)}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 24px;font-size:12px;font-weight:700;letter-spacing:.08em}.mark{display:flex;gap:8px;align-items:center}.ball{width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;position:relative}.ball:after{content:'';position:absolute;width:5px;height:5px;background:var(--ink);border-radius:50%;left:4px;top:4px}.counter{color:var(--muted)}
    .screen{display:none;animation:rise .35s ease both}.screen.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .hero{padding:28px 4px 20px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--coral);margin-bottom:18px}.hero h1{font-size:clamp(42px,11vw,68px);line-height:.96;letter-spacing:-.06em;margin:0 0 24px;font-weight:900}.hero h1 span{display:block;color:var(--coral)}.lede{font-size:16px;line-height:1.65;max-width:380px;color:#364039}.stamp{display:inline-flex;align-items:center;background:var(--ink);color:var(--lime);padding:8px 12px;font-size:12px;font-weight:700;transform:rotate(-2deg);margin:20px 0 36px}.primary{width:100%;background:var(--ink);color:var(--paper);padding:17px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;transition:.2s}.primary:hover{background:var(--coral);transform:translateY(-2px)}.arrow{font-size:22px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
    .progress{height:4px;background:var(--line);margin:4px 0 32px}.progress i{display:block;height:100%;background:var(--coral);transition:width .3s}.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:22px}.question{font-size:28px;line-height:1.3;letter-spacing:-.03em;font-weight:800;margin:0 0 28px}.options{display:grid;gap:10px}.option{position:relative;text-align:left;padding:17px 42px 17px 16px;background:#fffdf7;border:1px solid var(--line);font-size:15px;line-height:1.45;transition:.2s}.option:hover{border-color:var(--ink);transform:translateX(3px)}.option.selected{background:var(--lime);border-color:var(--ink);font-weight:700}.option b{position:absolute;right:16px;top:16px;font-size:18px}.back{background:transparent;color:var(--muted);padding:14px 0;font-size:13px}.nav{display:flex;align-items:center;justify-content:space-between;margin-top:28px}.nav .primary{width:auto;min-width:170px}.disabled{opacity:.35;pointer-events:none}
    .result-head{background:var(--ink);color:var(--paper);padding:28px 22px 24px;position:relative}.result-head .eyebrow{color:var(--lime)}.result-head h2{font-size:38px;line-height:1.05;letter-spacing:-.05em;margin:8px 0 12px}.result-head p{margin:0;color:#d5d8ce;font-size:14px;line-height:1.6}.badge{position:absolute;right:20px;top:24px;border:1px solid var(--lime);color:var(--lime);font-size:11px;padding:7px 9px;letter-spacing:.08em}.result-body{padding:24px 4px}.score-row{display:flex;justify-content:space-between;align-items:end;margin:18px 0 8px;font-size:13px}.score-row strong{font-size:20px}.bar{height:8px;background:var(--line)}.bar i{display:block;height:100%;background:var(--coral)}.insight{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}.insight h3{font-size:15px;margin:0 0 8px}.insight p{font-size:14px;line-height:1.7;margin:0;color:#4b554e}.sharebox{background:#fffdf7;border:1px solid var(--line);padding:18px;margin-top:24px}.sharebox h3{font-size:15px;margin:0 0 6px}.sharebox p{font-size:12px;color:var(--muted);margin:0 0 14px}.share-actions{display:flex;gap:8px}.secondary{flex:1;background:var(--ink);color:var(--paper);padding:13px 10px;font-size:13px;font-weight:700}.secondary.alt{background:var(--lime);color:var(--ink)}.footer-actions{display:flex;gap:18px;margin-top:24px}.text-btn{background:none;padding:10px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:4px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:12px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:4}.toast.show{opacity:1;transform:translateX(-50%)}.qr-modal{display:none;position:fixed;inset:0;background:rgba(16,24,32,.72);align-items:center;justify-content:center;padding:24px;z-index:3}.qr-modal.show{display:flex}.qr-card{background:var(--paper);padding:22px;text-align:center;width:min(100%,330px)}.qr-card h3{margin:0 0 16px}.qr-card img{width:220px;height:220px;display:block;margin:auto;background:#fff}.close{margin-top:16px;background:var(--ink);color:#fff;padding:11px 24px;font-size:13px}
    @media(min-width:600px){.shell{padding:40px}.app{min-height:calc(100vh - 80px)}.hero{padding-top:50px}.question{font-size:32px}}
  </style>
</head>
<body><main class="shell"><div class="app">
  <div class="topbar"><div class="mark"><span class="ball"></span> FOOTBALL FANS LAB</div><div class="counter" id="counter">READY</div></div>
  <section id="start" class="screen active"><div class="hero"><div class="eyebrow">足彩运营研究 · 2026</div><h1>你是哪种<span>足彩玩家？</span></h1><p class="lede">15 个选择，测出你的投注人格。没有标准答案，只有更像你的那一种。</p><div class="stamp">约 3 分钟 · 即刻出结果</div><button class="primary" id="startBtn">开始测试 <span class="arrow">→</span></button><p class="note">结果仅用于趣味分析。答题记录只保存在当前浏览器，可随时导出。</p></div></section>
  <section id="quiz" class="screen"><div class="progress"><i id="progressFill" style="width:6.67%"></i></div><div class="qmeta"><span id="qnum">01 / 15</span><span id="qtag">MATCHDAY</span></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="nav"><button class="back" id="backBtn">← 上一题</button><button class="primary disabled" id="nextBtn">下一题 <span class="arrow">→</span></button></div></section>
  <section id="result" class="screen"><div class="result-head"><div class="eyebrow">YOUR FAN PROFILE</div><div class="badge" id="resultCode">FAN-01</div><h2 id="resultTitle"></h2><p id="resultDesc"></p></div><div class="result-body"><div id="scores"></div><div class="insight"><h3>你的投注习惯</h3><p id="resultInsight"></p></div><div class="sharebox"><h3>把结果发给朋友</h3><p>生成专属结果链接，看看谁和你最像。</p><div class="share-actions"><button class="secondary" id="copyBtn">复制链接</button><button class="secondary alt" id="qrBtn">查看二维码</button></div></div><div class="footer-actions"><button class="text-btn" id="restartBtn">再测一次</button><button class="text-btn" id="exportBtn">导出我的答题数据</button></div></div></section>
</div></main><div class="toast" id="toast"></div><div class="qr-modal" id="qrModal"><div class="qr-card"><h3>扫码查看你的结果</h3><img id="qrImg" alt="结果二维码"><button class="close" id="closeQr">关闭</button></div></div>
<script>
const questions=[
 ['周末第一场球开赛前，你通常会？',['先看阵容和伤停，再决定','凭感觉挑一场顺眼的','约朋友讨论到最后一刻','先把整天赛程过一遍']],
 ['临场赔率突然大幅变化，你的第一反应是？',['查新闻，确认有没有内幕','觉得有戏，马上跟进','先观望，等走势稳定','记录下来，赛后复盘']],
 ['朋友说“这场稳了”，你会？',['问他依据是什么','被带动，加入这张单','礼貌提醒风险','各买各的，互不影响']],
 ['你更享受哪种投注方式？',['单关，研究透一场','串关，追求高回报','小额多场，保持参与感','长期跟踪固定联赛']],
 ['比分 0:0 进入下半场，你会？',['重新评估，考虑走盘','补一张进球盘','不动，信自己的判断','打开数据看射门和 xG']],
 ['你心中的“好预测”是？',['命中结果','过程逻辑严密','和朋友一起猜中','长期收益稳定']],
 ['遇到连黑三场，你更可能？',['暂停，整理模型','下一场加一点扳回','换个联赛试试','复盘每一次决策']],
 ['你选择联赛的标准是？',['数据样本足够多','喜欢的球队在踢','赔率有价值','自己看得懂的节奏']],
 ['赛前 10 分钟，你会不会改票？',['除非有新信息','经常，临场感觉最准','问问身边的人','只按预设规则执行']],
 ['中了一个高赔比分，你会？',['记录方法，继续验证','截图发群里庆祝','请朋友吃饭','把奖金分配到后续计划']],
 ['你怎么看“玄学”预测？',['有趣，但不能代替数据','偶尔信一次，图个乐','大家都信就有气氛','只信可验证的东西']],
 ['一张票最重要的价值是？',['信息判断的结论','看球时的期待感','和朋友的共同话题','可持续的资金管理']],
 ['如果做一个自己的模型，你会先做？',['胜平负概率','进球数分布','球队状态评分','资金与仓位规则']],
 ['你最常关注的赛后内容是？',['关键数据和战术','精彩集锦和评论','朋友们的战绩','模型偏差和复盘']],
 ['给刚入门的彩民一句话？',['先学会判断，再谈投注','小玩怡情，开心最重要','找到一起看球的人','给自己设好边界和预算']]
];
const profiles=[
 {title:'数据侦探',code:'FAN-01',desc:'你把球场当作一座持续更新的实验室。每一次下注，都是对判断的验证。',insight:'擅长拆解信息、寻找赔率里的价值。你不追求每场都赢，更在意方法能否长期复用。',scores:[['研究力',92],['纪律性',78],['社交感',42]]},
 {title:'热血追风',code:'FAN-02',desc:'你相信直觉，也享受比赛带来的心跳。对你来说，足球首先是一种参与。',insight:'临场感是你的超能力，气氛和信念会让你做出果断选择。给热情配一个预算，会玩得更久。',scores:[['研究力',48],['纪律性',45],['社交感',94]]},
 {title:'理性掌舵人',code:'FAN-03',desc:'你享受做决定的过程，也清楚什么应该交给概率。稳，是你独特的锋芒。',insight:'你会在热闹里保持清醒，用规则保护判断。稳定的小优势，往往比偶然的大惊喜更吸引你。',scores:[['研究力',76],['纪律性',94],['社交感',58]]},
 {title:'看球社交家',code:'FAN-04',desc:'一场球因为有人一起看而更精彩。你用投注打开话题，把赛程变成聚会。',insight:'你很会把复杂的比赛讲成大家都听得懂的故事。保持轻松、控制额度，快乐就是最好的回报。',scores:[['研究力',54],['纪律性',63],['社交感',96]]}
];
let current=0,answers=[];const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
function renderQ(){const q=questions[current];$('counter').textContent=`${String(current+1).padStart(2,'0')} / 15`;$('qnum').textContent=`${String(current+1).padStart(2,'0')} / 15`;$('question').textContent=q[0];$('qtag').textContent=['MATCHDAY','ODDS','MINDSET','STYLE'][current%4];$('progressFill').style.width=((current+1)/15*100)+'%';$('options').innerHTML=q[1].map((o,i)=>`<button class="option ${answers[current]===i?'selected':''}" data-i="${i}">${o}<b>${String.fromCharCode(65+i)}</b></button>`).join('');$('nextBtn').classList.toggle('disabled',answers[current]===undefined);document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[current]=+b.dataset.i;renderQ()});}
function finish(){const counts=[0,0,0,0];answers.forEach((a,i)=>counts[(a+i)%4]++);const p=profiles[counts.indexOf(Math.max(...counts))];$('resultTitle').textContent=p.title;$('resultCode').textContent=p.code;$('resultDesc').textContent=p.desc;$('resultInsight').textContent=p.insight;$('scores').innerHTML=p.scores.map(([n,v])=>`<div class="score-row"><span>${n}</span><strong>${v}</strong></div><div class="bar"><i style="width:${v}%"></i></div>`).join('');localStorage.setItem('footballTestLatest',JSON.stringify({answers,profile:p.code,at:new Date().toISOString()}));show('result');$('counter').textContent='RESULT';}
function resultUrl(){const payload=btoa(JSON.stringify({a:answers})).replace(/=/g,'');return location.href.split('#')[0]+'#r='+payload}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
$('startBtn').onclick=()=>{current=0;answers=[];show('quiz');renderQ()};$('backBtn').onclick=()=>{if(current>0){current--;renderQ()}};$('nextBtn').onclick=()=>{if(answers[current]===undefined)return;if(current<14){current++;renderQ()}else finish()};$('restartBtn').onclick=()=>{$('startBtn').click()};$('copyBtn').onclick=async()=>{const u=resultUrl();try{await navigator.clipboard.writeText(u);toast('结果链接已复制')}catch{toast('请手动复制地址栏链接')}};$('qrBtn').onclick=()=>{$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(resultUrl());$('qrModal').classList.add('show')};$('closeQr').onclick=()=>$('qrModal').classList.remove('show');$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({answers,at:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='football-fan-test.json';a.click();URL.revokeObjectURL(a.href);toast('答题数据已导出')};
(()=>{if(location.hash.startsWith('#r=')){try{const d=JSON.parse(atob(location.hash.slice(3)));answers=d.a||[];if(answers.length===15)finish()}catch{}}})();
</script></body></html>
